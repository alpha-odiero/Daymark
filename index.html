<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f6f3">
  <meta name="description" content="Daymark JOURNAL — your books, thoughts, and daily goals in one thoughtful space. Track reading, journal with photos, manage tasks and goals.">
  <meta name="keywords" content="Daymark JOURNAL, daymark journal, reading tracker, journal app, book library, free books, public domain classics, task manager, goals, daily planner, personal journal, diary app, mood tracker">
  <meta name="author" content="Daymark">
  <link rel="canonical" href="https://daymark.app/">
  <meta property="og:title" content="Daymark JOURNAL">
  <meta property="og:description" content="Your books, thoughts, and daily goals in one thoughtful space. Track reading, journal with photos, manage tasks and goals.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://daymark.app/">
  <meta property="og:image" content="icon.svg">
  <meta property="og:site_name" content="Daymark JOURNAL">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Daymark JOURNAL">
  <meta name="twitter:description" content="Your books, thoughts, and daily goals in one thoughtful space.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <meta name="google-site-verification" content="Qb5fvAevj_gqHvjdykTMA47MyFueviCSqU1SmmBWbGM" />
  <link rel="stylesheet" href="style.css?v=7">
  <title>Daymark JOURNAL</title>
</head>
<body>
  <div class="splash" id="splash" aria-label="Loading">
    <div class="loader-circle" aria-hidden="true"></div>
  </div>

  <div class="app-shell" id="appShell" hidden>
    <header class="topbar">
      <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Open navigation menu" aria-expanded="false">☰</button>
      <a class="brand" href="#" data-page="home">Daymark <span>JOURNAL</span><b></b></a>
      <nav class="desktop-nav" aria-label="Main navigation">
        <button data-page="home" class="nav-link active">Home</button>
        <button data-page="library" class="nav-link">Library</button>
        <div class="nav-dropdown" data-nav-dropdown data-pages="discover freebooks">
          <button class="nav-link nav-dropdown-toggle" data-nav-toggle aria-haspopup="true" aria-expanded="false">Get Inspired <span class="nav-caret" aria-hidden="true">⌄</span></button>
          <div class="nav-dropdown-menu" hidden>
            <button data-page="discover">Discover</button>
            <button data-page="freebooks">Free Books</button>
          </div>
        </div>
        <div class="nav-dropdown" data-nav-dropdown data-pages="journal todo goals">
          <button class="nav-link nav-dropdown-toggle" data-nav-toggle aria-haspopup="true" aria-expanded="false">Personal Workspace <span class="nav-caret" aria-hidden="true">⌄</span></button>
          <div class="nav-dropdown-menu" hidden>
            <button data-page="journal">Journal</button>
            <button data-page="todo">To Do</button>
            <button data-page="goals">Goals</button>
          </div>
        </div>
        <button data-page="docs" class="nav-link">Docs</button>
      </nav>
      <div class="top-actions">
        <button class="icon-btn" id="themeToggle" aria-label="Toggle dark theme" title="Toggle theme">◐</button>
        <button class="button button-primary install-btn" id="installBtn">Get App</button>
      </div>
    </header>

    <div class="mobile-menu" id="mobileMenu" hidden>
      <button data-page="home">Home</button>
      <button data-page="library">Library</button>
      <div class="mobile-nav-group" data-nav-dropdown data-pages="discover freebooks">
        <button class="mobile-nav-toggle" data-nav-toggle aria-expanded="false">Get Inspired <span class="nav-caret" aria-hidden="true">⌄</span></button>
        <div class="mobile-submenu" hidden>
          <button data-page="discover">Discover</button>
          <button data-page="freebooks">Free Books</button>
        </div>
      </div>
      <div class="mobile-nav-group" data-nav-dropdown data-pages="journal todo goals">
        <button class="mobile-nav-toggle" data-nav-toggle aria-expanded="false">Personal Workspace <span class="nav-caret" aria-hidden="true">⌄</span></button>
        <div class="mobile-submenu" hidden>
          <button data-page="journal">Journal</button>
          <button data-page="todo">To Do</button>
          <button data-page="goals">Goals</button>
        </div>
      </div>
      <div class="mobile-menu-divider" aria-hidden="true"></div>
      <button data-page="categories">Categories</button>
      <button data-page="stats">Statistics</button>
      <button data-page="docs">Docs</button>
      <button data-page="settings">Settings</button>
    </div>

    <main id="mainContent" class="main-content" tabindex="-1"></main>

    <nav class="bottom-nav" id="bottomNav" aria-label="App navigation">
      <button data-page="home" class="bottom-link active"><span>⌂</span><small>Home</small></button>
      <button data-page="library" class="bottom-link"><span>▤</span><small>Library</small></button>
      <button data-page="journal" class="bottom-link"><span>✎</span><small>Journal</small></button>
      <button data-page="todo" class="bottom-link"><span>☑</span><small>To-Do</small></button>
      <button data-page="goals" class="bottom-link"><span>★</span><small>Goals</small></button>
      <button data-page="docs" class="bottom-link"><span>📖</span><small>Docs</small></button>
    </nav>
  </div>

  <div id="onboarding" class="onboarding" hidden></div>

  <div class="page-loader" id="pageLoader" hidden aria-live="polite" aria-label="Loading page">
    <div class="loader-circle" aria-hidden="true"></div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-heading"><h2 id="modalTitle">Add item</h2><button class="icon-btn" id="closeModal" aria-label="Close dialog">×</button></div>
      <div id="modalBody"></div>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    setTimeout(function () {
      var shell = document.getElementById("appShell");
      var main = document.getElementById("mainContent");
      if (!shell || !main) return;
      shell.hidden = false;
      if (main.textContent.trim()) return;
      main.innerHTML = '<section class="page-heading"><div><p class="eyebrow">DAYMARK JOURNAL</p><h1>We could not load your journal.</h1><p class="subtitle">Check your connection, then reload the page.</p></div><button class="button button-primary" onclick="location.reload()">Reload</button></section>';
    }, 4000);
  </script>
  <script type="module" src="app.js?v=7"></script>
</body>
</html>
